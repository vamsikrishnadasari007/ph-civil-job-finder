name: Refresh jobs

on:
  schedule:
    # Off-peak minutes: GitHub delays or drops many runs scheduled at :00 / :30.
    - cron: "13,43 * * * *"  # quick: new postings only (each site has its own cadence inside)
    - cron: "17 18 * * *"    # full sweep: 2:17 AM Manila (UTC+8)
  workflow_dispatch:         # "Search now" button on the website, or "Run workflow" on GitHub
    inputs:
      mode:
        description: quick or full
        default: quick
      force:
        description: ignore per-site cadence (true/false)
        default: "false"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Scrape
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "17 18 * * *" ]; then MODE=full; fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python run_scrape.py --mode "${MODE:-quick}" $FORCE
